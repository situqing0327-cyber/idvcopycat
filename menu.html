<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>放映厅 · 六〇旧日记</title>
  <!-- 引用 Google Font 哥特/手写体 (英文) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Playfair+Display:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    /* 全局重置 — 怀旧纸页基底 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #2b221c;  /* 深色环境衬托 */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
      font-family: 'Times New Roman', 'Georgia', '华文楷体', serif;
      position: relative;
    }

    /* ===== 翻开的日记本 ===== */
    .diary {
      max-width: 900px;
      width: 100%;
      background: #e8ddd0;  /* 旧纸基色 */
      background-image: 
        /* 纸张纤维纹理 (网络素材模拟) */
        repeating-linear-gradient(45deg, 
          rgba(180, 160, 140, 0.08) 0px, 
          rgba(180, 160, 140, 0.08) 2px, 
          rgba(140, 120, 100, 0.05) 2px, 
          rgba(140, 120, 100, 0.05) 4px),
        repeating-linear-gradient(-45deg, 
          rgba(160, 140, 120, 0.06) 0px, 
          rgba(160, 140, 120, 0.06) 3px, 
          rgba(120, 100, 80, 0.04) 3px, 
          rgba(120, 100, 80, 0.04) 6px),
        radial-gradient(ellipse at 20% 30%, rgba(200, 180, 160, 0.3) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(160, 140, 120, 0.2) 0%, transparent 50%);
      padding: 2.8rem 2.2rem 2.2rem;
      border-radius: 8px 48px 8px 48px;
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.8),
        inset 0 0 60px rgba(100, 80, 60, 0.2),
        /* 书脊/封面边缘 */
        0 0 0 1px #b8a084,
        0 0 0 3px #4d3a2c,
        0 0 0 6px #7a6856;
      position: relative;
      transform: rotate(-0.4deg);
      transition: all 0.2s;
      border: 1px solid #a08872;
    }

    /* 模拟翻开的“书页”中线阴影 */
    .diary::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      background: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(120, 100, 80, 0.2) 20%, 
        rgba(120, 100, 80, 0.3) 50%, 
        rgba(120, 100, 80, 0.2) 80%, 
        transparent 100%);
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 2;
      box-shadow: 0 0 12px rgba(0,0,0,0.05);
    }

    /* 做旧斑点 / 水渍 (更丰富) */
    .diary::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 8px 48px 8px 48px;
      background: 
        radial-gradient(ellipse at 15% 20%, rgba(120, 90, 70, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 80%, rgba(90, 70, 50, 0.15) 0%, transparent 40%),
        radial-gradient(ellipse at 45% 60%, rgba(140, 110, 80, 0.08) 0%, transparent 30%),
        radial-gradient(ellipse at 70% 15%, rgba(100, 80, 60, 0.1) 0%, transparent 35%);
      pointer-events: none;
      z-index: 1;
    }

    /* 内容区 — 放在纹理之上 */
    .content {
      position: relative;
      z-index: 3;
    }

    /* ===== 标题：放映厅 · 六〇 ===== */
    .title-section {
      text-align: center;
      margin-bottom: 2.4rem;
      padding-bottom: 1rem;
      border-bottom: 2px dashed #b0987e;
      position: relative;
    }

    .title-section h1 {
      font-family: 'MedievalSharp', 'Times New Roman', cursive;
      font-size: 3.4rem;
      font-weight: 400;
      letter-spacing: 14px;
      color: #2b1f18;
      text-shadow: 
        0 0 4px rgba(160, 130, 100, 0.2),
        3px 3px 0 rgba(120, 90, 70, 0.15),
        -1px -1px 0 rgba(230, 210, 190, 0.3);
      text-transform: uppercase;
      word-spacing: 8px;
      transform: scaleY(0.98);
      line-height: 1.2;
    }

    .title-section .sub {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-top: 6px;
      font-size: 1rem;
      color: #6a5a48;
      border-top: 1px solid #b8a084;
      padding-top: 10px;
      letter-spacing: 3px;
    }

    .title-section .sub .en {
      font-family: 'Special Elite', 'Times New Roman', cursive;
      font-size: 1.2rem;
      letter-spacing: 4px;
      color: #4d3a2c;
      opacity: 0.8;
      font-weight: 400;
    }

    .title-section .sub .zh {
      font-family: '华文楷体', 'KaiTi', 'Georgia', serif;
      font-size: 1rem;
      letter-spacing: 6px;
      color: #5f4c3a;
      border-left: 1px solid #b8a084;
      padding-left: 1.2rem;
      font-style: italic;
    }

    /* ===== 三个选项：信件 · 胶卷片 · 钢笔 ===== */
    .options {
      display: flex;
      flex-direction: column;
      gap: 2.2rem;
      margin: 2.8rem 0 1.8rem;
      position: relative;
      z-index: 3;
    }

    /* 每个选项卡片 — 旧日记风格 */
    .option-card {
      display: flex;
      align-items: center;
      gap: 1.8rem;
      padding: 1rem 1.8rem 1rem 1.2rem;
      background: rgba(230, 215, 195, 0.3);
      background-image: 
        linear-gradient(145deg, rgba(220, 200, 180, 0.4) 0%, rgba(190, 170, 150, 0.2) 100%),
        repeating-linear-gradient(45deg, 
          transparent 0px, 
          transparent 4px, 
          rgba(160, 140, 120, 0.03) 4px, 
          rgba(160, 140, 120, 0.03) 5px);
      border: 1px solid #b8a084;
      border-radius: 60px 12px 60px 12px;
      box-shadow: 
        inset 0 -2px 0 #7a6856,
        inset 0 4px 12px rgba(255, 235, 200, 0.2),
        0 6px 16px rgba(0, 0, 0, 0.2),
        0 0 0 1px #d0beaa;
      transition: all 0.15s ease;
      cursor: pointer;
      text-decoration: none;
      color: #2b1f18;
      transform: rotate(-0.1deg);
      position: relative;
    }

    /* 做旧磨损线 */
    .option-card::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 20px;
      width: 40px;
      height: 3px;
      background: rgba(160, 130, 100, 0.1);
      border-radius: 50%;
      filter: blur(3px);
      pointer-events: none;
    }

    .option-card::after {
      content: '';
      position: absolute;
      bottom: 8px;
      right: 20px;
      width: 30px;
      height: 3px;
      background: rgba(120, 90, 70, 0.08);
      border-radius: 50%;
      filter: blur(3px);
      pointer-events: none;
    }

    /* 图标区域 — 纯风格化，无emoji，用字符+哥特装饰 */
    .icon-box {
      flex-shrink: 0;
      width: 70px;
      height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Special Elite', 'Times New Roman', serif;
      font-size: 2.4rem;
      color: #3d2e22;
      background: rgba(200, 180, 160, 0.2);
      border-radius: 50%;
      border: 1px solid #b8a084;
      box-shadow: inset 0 0 20px rgba(120, 90, 70, 0.1);
      transition: all 0.15s;
      position: relative;
      letter-spacing: 2px;
    }

    /* 不同图标各自风格 (信件/胶卷/钢笔) */
    .option-card:nth-child(1) .icon-box {
      font-family: 'MedievalSharp', cursive;
      font-size: 2.8rem;
      color: #4d3a2c;
      background: rgba(210, 185, 160, 0.25);
      border-color: #b0987e;
    }
    .option-card:nth-child(2) .icon-box {
      font-family: 'Special Elite', serif;
      font-size: 2.2rem;
      color: #3d3228;
      background: rgba(190, 170, 150, 0.2);
      border-color: #a08872;
    }
    .option-card:nth-child(3) .icon-box {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      color: #2f241e;
      background: rgba(200, 180, 155, 0.2);
      border-color: #b0987e;
    }

    /* 文字内容 */
    .option-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .option-text .zh {
      font-family: '华文楷体', 'KaiTi', 'Georgia', serif;
      font-size: 1.9rem;
      font-weight: 400;
      letter-spacing: 8px;
      color: #1f1610;
      text-shadow: 1px 1px 0 rgba(200, 180, 160, 0.3);
      line-height: 1.2;
    }

    .option-text .en {
      font-family: 'Special Elite', 'Times New Roman', cursive;
      font-size: 1rem;
      letter-spacing: 4px;
      color: #5f4c3a;
      opacity: 0.7;
      font-weight: 400;
      font-style: italic;
      border-top: 1px dotted #b8a084;
      padding-top: 4px;
      display: inline-block;
      width: fit-content;
    }

    /* 悬停效果 — 日记翻动 */
    .option-card:hover {
      transform: scale(1.02) rotate(0.3deg);
      background: rgba(235, 215, 195, 0.5);
      box-shadow: 
        inset 0 -2px 0 #7a6856,
        inset 0 4px 20px rgba(255, 235, 200, 0.3),
        0 12px 28px rgba(0, 0, 0, 0.3),
        0 0 0 1px #cbb59e;
      border-color: #a08872;
    }

    .option-card:hover .icon-box {
      background: rgba(200, 180, 155, 0.35);
      box-shadow: inset 0 0 30px rgba(120, 90, 70, 0.15);
      transform: scale(1.05);
    }

    .option-card:active {
      transform: scale(0.97) rotate(-0.1deg);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.2);
      transition: 0.03s;
    }

    /* ===== 页脚 — 旧日记标记 ===== */
    .footer-note {
      margin-top: 2.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #b0987e;
      padding-top: 1rem;
      font-size: 0.8rem;
      color: #7a6856;
      letter-spacing: 2px;
      font-style: italic;
      opacity: 0.7;
      position: relative;
      z-index: 3;
    }

    .footer-note .left {
      font-family: 'Special Elite', 'Times New Roman', serif;
      font-size: 0.8rem;
      letter-spacing: 4px;
      color: #6a5a48;
    }

    .footer-note .right {
      font-family: '华文楷体', 'KaiTi', serif;
      font-size: 0.9rem;
      letter-spacing: 6px;
      border-left: 1px solid #b0987e;
      padding-left: 1.2rem;
      color: #8f7a66;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 600px) {
      .diary {
        padding: 1.8rem 1rem;
        border-radius: 6px 28px 6px 28px;
      }
      .title-section h1 {
        font-size: 2.4rem;
        letter-spacing: 8px;
      }
      .title-section .sub {
        font-size: 0.8rem;
        gap: 0.6rem;
      }
      .option-card {
        padding: 0.8rem 1rem;
        gap: 1rem;
        border-radius: 40px 8px 40px 8px;
      }
      .icon-box {
        width: 54px;
        height: 54px;
        font-size: 1.8rem;
      }
      .option-text .zh {
        font-size: 1.4rem;
        letter-spacing: 4px;
      }
      .option-text .en {
        font-size: 0.8rem;
        letter-spacing: 2px;
      }
      .options {
        gap: 1.4rem;
        margin: 2rem 0;
      }
      .footer-note {
        flex-direction: column;
        gap: 0.3rem;
        align-items: flex-start;
      }
    }

    /* 装饰：老旧胶卷齿孔 (极淡) */
    .film-perf {
      position: absolute;
      bottom: 10%;
      right: 2%;
      width: 120px;
      height: 40px;
      background: repeating-linear-gradient(90deg, 
        transparent 0px, 
        transparent 6px, 
        rgba(80, 60, 40, 0.05) 6px, 
        rgba(80, 60, 40, 0.05) 8px);
      border-radius: 20px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.5;
      transform: rotate(-4deg);
    }

    /* 信纸折痕装饰 */
    .letter-fold {
      position: absolute;
      top: 15%;
      left: 5%;
      width: 30%;
      height: 2px;
      background: rgba(120, 90, 70, 0.08);
      transform: rotate(-6deg);
      filter: blur(2px);
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="diary">
    <!-- 装饰层 -->
    <div class="film-perf"></div>
    <div class="letter-fold"></div>

    <div class="content">
      <!-- 标题：放映厅 · 六〇 -->
      <div class="title-section">
        <h1>放 映 厅</h1>
        <div class="sub">
          <span class="en">✦ projection hall ✦</span>
          <span class="zh">· 一九六〇 ·</span>
        </div>
      </div>

      <!-- 三个选项：信件 · 胶卷片 · 钢笔 (无emoji，纯字符风格) -->
      <div class="options">
        <!-- 1. 信件 -->
        <a href="#" class="option-card" id="btn-letter" data-url="https://example.com/letter">
          <div class="icon-box">✉</div>
          <div class="option-text">
            <span class="zh">信 件</span>
            <span class="en">· letter ·</span>
          </div>
        </a>

        <!-- 2. 胶卷片 -->
        <a href="#" class="option-card" id="btn-film" data-url="https://example.com/film">
          <div class="icon-box">☯</div>
          <div class="option-text">
            <span class="zh">胶 卷 片</span>
            <span class="en">· film reel ·</span>
          </div>
        </a>

        <!-- 3. 钢笔 -->
        <a href="#" class="option-card" id="btn-pen" data-url="https://example.com/pen">
          <div class="icon-box">✎</div>
          <div class="option-text">
            <span class="zh">钢 笔</span>
            <span class="en">· fountain pen ·</span>
          </div>
        </a>
      </div>

      <!-- 页脚 -->
      <div class="footer-note">
        <span class="left">◈ 旧 日 残 页 ◈</span>
        <span class="right">☯ 映 像 拾 遗 ☯</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // 获取三个选项
      const letterBtn = document.getElementById('btn-letter');
      const filmBtn = document.getElementById('btn-film');
      const penBtn = document.getElementById('btn-pen');

      // URL 映射 (sample)
      const urlMap = {
        letter: 'https://example.com/letter',
        film: 'https://example.com/film',
        pen: 'https://example.com/pen'
      };

      // 统一跳转
      function handleNavigation(event, url) {
        event.preventDefault();
        if (url && url.startsWith('http')) {
          window.location.href = url;
        } else {
          alert(`[放映厅 · 六〇] 即将前往：${url || '未设定路径'}`);
        }
      }

      // 绑定事件 (优先 data-url)
      letterBtn.addEventListener('click', function(e) {
        const url = this.getAttribute('data-url') || urlMap.letter;
        handleNavigation(e, url);
      });

      filmBtn.addEventListener('click', function(e) {
        const url = this.getAttribute('data-url') || urlMap.film;
        handleNavigation(e, url);
      });

      penBtn.addEventListener('click', function(e) {
        const url = this.getAttribute('data-url') || urlMap.pen;
        handleNavigation(e, url);
      });

      // 控制台辅助
      console.log('📜 放映厅 · 六〇日记 跳转配置 (可修改 urlMap)');
      console.log('当前映射: ', urlMap);
      window.__diary = {
        urlMap: urlMap,
        updateUrl: function(key, newUrl) {
          if (urlMap.hasOwnProperty(key)) {
            urlMap[key] = newUrl;
            const btnMap = { letter: letterBtn, film: filmBtn, pen: penBtn };
            if (btnMap[key]) {
              btnMap[key].setAttribute('data-url', newUrl);
            }
            console.log(`✅ 已更新 ${key} 地址: ${newUrl}`);
          } else {
            console.warn('可用键: letter, film, pen');
          }
        }
      };
    })();
  </script>
</body>
</html>
