<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>放映厅 · 六〇旧日记</title>
  <!-- 引入真实手写/哥特风格字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Special+Elite&family=Playfair+Display:ital@0;1&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* 全局重置 — 老纸氛围 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #2a211b;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
      font-family: 'Times New Roman', 'Georgia', '华文楷体', serif;
    }

    /* ===== 翻开的旧日记 ===== */
    .diary {
      max-width: 940px;
      width: 100%;
      background: #e1d4c4;
      background-image: 
        /* 真实纸张纤维纹理 (多层叠加) */
        repeating-linear-gradient(45deg, 
          rgba(170, 150, 130, 0.10) 0px, 
          rgba(170, 150, 130, 0.10) 1px, 
          rgba(140, 120, 100, 0.06) 1px, 
          rgba(140, 120, 100, 0.06) 3px,
          rgba(190, 170, 150, 0.04) 3px,
          rgba(190, 170, 150, 0.04) 5px),
        repeating-linear-gradient(-45deg, 
          rgba(150, 130, 110, 0.08) 0px, 
          rgba(150, 130, 110, 0.08) 2px, 
          rgba(120, 100, 80, 0.05) 2px, 
          rgba(120, 100, 80, 0.05) 5px),
        repeating-linear-gradient(0deg, 
          rgba(180, 160, 140, 0.03) 0px, 
          rgba(180, 160, 140, 0.03) 8px, 
          rgba(140, 120, 100, 0.04) 8px, 
          rgba(140, 120, 100, 0.04) 9px),
        radial-gradient(ellipse at 25% 20%, rgba(210, 190, 170, 0.3) 0%, transparent 60%),
        radial-gradient(ellipse at 75% 80%, rgba(170, 150, 130, 0.2) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(190, 175, 155, 0.1) 0%, transparent 70%);
      padding: 3rem 2.5rem 2.2rem;
      border-radius: 12px 56px 12px 56px;
      box-shadow: 
        0 32px 64px rgba(0, 0, 0, 0.8),
        inset 0 0 80px rgba(100, 80, 60, 0.15),
        /* 书封边缘 */
        0 0 0 1px #b0987e,
        0 0 0 3px #4d3a2c,
        0 0 0 6px #7a6856;
      position: relative;
      transform: rotate(-0.3deg);
      transition: all 0.2s;
      border: 1px solid #a08872;
    }

    /* 书页中缝 (模拟翻开) */
    .diary::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      background: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(120, 100, 80, 0.25) 15%, 
        rgba(120, 100, 80, 0.35) 50%, 
        rgba(120, 100, 80, 0.25) 85%, 
        transparent 100%);
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 2;
      box-shadow: 0 0 14px rgba(0,0,0,0.06);
    }

    /* 做旧污渍 / 水渍 / 霉斑 (更丰富真实) */
    .diary::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px 56px 12px 56px;
      background: 
        radial-gradient(ellipse at 12% 18%, rgba(130, 100, 80, 0.13) 0%, transparent 45%),
        radial-gradient(ellipse at 88% 75%, rgba(100, 80, 60, 0.18) 0%, transparent 40%),
        radial-gradient(ellipse at 40% 65%, rgba(150, 120, 95, 0.08) 0%, transparent 30%),
        radial-gradient(ellipse at 72% 12%, rgba(110, 85, 65, 0.10) 0%, transparent 35%),
        radial-gradient(ellipse at 55% 40%, rgba(180, 155, 130, 0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
    }

    /* 额外的磨损痕迹 */
    .wear-mark {
      position: absolute;
      bottom: 8%;
      left: 3%;
      width: 40%;
      height: 15%;
      background: radial-gradient(ellipse at 30% 50%, rgba(80, 60, 40, 0.06) 0%, transparent 70%);
      filter: blur(6px);
      pointer-events: none;
      z-index: 1;
      border-radius: 50%;
    }

    .content {
      position: relative;
      z-index: 3;
    }

    /* ===== 标题：放映厅 · 六〇 ===== */
    .title-section {
      text-align: center;
      margin-bottom: 2.6rem;
      padding-bottom: 1.2rem;
      border-bottom: 2px dashed #b0987e;
      position: relative;
    }

    .title-section h1 {
      font-family: 'MedievalSharp', 'Times New Roman', cursive;
      font-size: 3.6rem;
      font-weight: 400;
      letter-spacing: 16px;
      color: #241a14;
      text-shadow: 
        0 0 6px rgba(160, 130, 100, 0.15),
        3px 3px 0 rgba(120, 90, 70, 0.12),
        -1px -1px 0 rgba(230, 210, 190, 0.25);
      text-transform: uppercase;
      word-spacing: 6px;
      transform: scaleY(0.98);
      line-height: 1.15;
    }

    .title-section .sub {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.8rem;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 1rem;
      color: #6a5a48;
      border-top: 1px solid #b8a084;
      padding-top: 12px;
      letter-spacing: 3px;
    }

    .title-section .sub .en {
      font-family: 'Special Elite', 'Times New Roman', cursive;
      font-size: 1.3rem;
      letter-spacing: 5px;
      color: #4d3a2c;
      opacity: 0.8;
      font-weight: 400;
    }

    .title-section .sub .zh {
      font-family: '华文楷体', 'KaiTi', 'Georgia', serif;
      font-size: 1.05rem;
      letter-spacing: 8px;
      color: #5f4c3a;
      border-left: 1px solid #b8a084;
      padding-left: 1.4rem;
      font-style: italic;
    }

    /* ===== 三个选项：信件 · 胶卷片 · 钢笔 ===== */
    .options {
      display: flex;
      flex-direction: column;
      gap: 2.2rem;
      margin: 2.8rem 0 2rem;
      position: relative;
      z-index: 3;
    }

    /* 每个选项 — 真实旧物卡片 */
    .option-card {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 1.2rem 2rem 1.2rem 1.5rem;
      background: rgba(215, 195, 175, 0.25);
      background-image: 
        linear-gradient(145deg, rgba(210, 190, 170, 0.3) 0%, rgba(180, 160, 140, 0.15) 100%),
        repeating-linear-gradient(45deg, 
          transparent 0px, 
          transparent 5px, 
          rgba(160, 140, 120, 0.03) 5px, 
          rgba(160, 140, 120, 0.03) 6px);
      border: 1px solid #b0987e;
      border-radius: 60px 16px 60px 16px;
      box-shadow: 
        inset 0 -2px 0 #7a6856,
        inset 0 4px 16px rgba(255, 235, 200, 0.15),
        0 8px 20px rgba(0, 0, 0, 0.18),
        0 0 0 1px #d0beaa;
      transition: all 0.15s ease;
      cursor: pointer;
      text-decoration: none;
      color: #241a14;
      transform: rotate(-0.1deg);
      position: relative;
    }

    /* 磨损线 */
    .option-card::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 22px;
      width: 45px;
      height: 3px;
      background: rgba(160, 130, 100, 0.10);
      border-radius: 50%;
      filter: blur(3px);
      pointer-events: none;
    }

    .option-card::after {
      content: '';
      position: absolute;
      bottom: 10px;
      right: 22px;
      width: 35px;
      height: 3px;
      background: rgba(120, 90, 70, 0.08);
      border-radius: 50%;
      filter: blur(3px);
      pointer-events: none;
    }

    /* 图标区 — 使用纯字符/符号，无emoji，模拟实物 */
    .icon-box {
      flex-shrink: 0;
      width: 80px;
      height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Special Elite', 'Times New Roman', serif;
      font-size: 2.6rem;
      color: #3d2e22;
      background: rgba(200, 180, 160, 0.15);
      border-radius: 50%;
      border: 1px solid #b0987e;
      box-shadow: inset 0 0 30px rgba(120, 90, 70, 0.08);
      transition: all 0.15s;
      position: relative;
      letter-spacing: 2px;
      /* 模拟旧物质感 */
      background-image: 
        radial-gradient(ellipse at 30% 20%, rgba(220, 200, 180, 0.2) 0%, transparent 60%);
    }

    /* 每个图标独立风格 (信件/胶卷/钢笔) */
    .option-card:nth-child(1) .icon-box {
      font-family: 'Playfair Display', 'Times New Roman', serif;
      font-size: 2.8rem;
      color: #4d3a2c;
      background: rgba(200, 180, 155, 0.2);
      border-color: #b0987e;
    }
    .option-card:nth-child(2) .icon-box {
      font-family: 'Special Elite', serif;
      font-size: 2.2rem;
      color: #3d3228;
      background: rgba(190, 170, 150, 0.18);
      border-color: #a08872;
      letter-spacing: 6px;
    }
    .option-card:nth-child(3) .icon-box {
      font-family: 'MedievalSharp', cursive;
      font-size: 2.8rem;
      color: #2f241e;
      background: rgba(200, 180, 155, 0.18);
      border-color: #b0987e;
    }

    /* 文字内容 */
    .option-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .option-text .zh {
      font-family: '华文楷体', 'KaiTi', 'Georgia', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 10px;
      color: #1f1610;
      text-shadow: 1px 1px 0 rgba(200, 180, 160, 0.2);
      line-height: 1.2;
    }

    .option-text .en {
      font-family: 'Special Elite', 'Times New Roman', cursive;
      font-size: 1.05rem;
      letter-spacing: 4px;
      color: #5f4c3a;
      opacity: 0.7;
      font-weight: 400;
      font-style: italic;
      border-top: 1px dotted #b8a084;
      padding-top: 5px;
      display: inline-block;
      width: fit-content;
    }

    /* 悬停 — 旧物被翻动 */
    .option-card:hover {
      transform: scale(1.02) rotate(0.3deg);
      background: rgba(225, 205, 185, 0.4);
      box-shadow: 
        inset 0 -2px 0 #7a6856,
        inset 0 4px 24px rgba(255, 235, 200, 0.25),
        0 14px 32px rgba(0, 0, 0, 0.25),
        0 0 0 1px #cbb59e;
      border-color: #a08872;
    }

    .option-card:hover .icon-box {
      background: rgba(200, 180, 155, 0.3);
      box-shadow: inset 0 0 40px rgba(120, 90, 70, 0.12);
      transform: scale(1.06);
    }

    .option-card:active {
      transform: scale(0.97) rotate(-0.1deg);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.2);
      transition: 0.03s;
    }

    /* ===== 页脚 ===== */
    .footer-note {
      margin-top: 2.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #b0987e;
      padding-top: 1.2rem;
      font-size: 0.8rem;
      color: #7a6856;
      letter-spacing: 2px;
      font-style: italic;
      opacity: 0.7;
      position: relative;
      z-index: 3;
    }

    .footer-note .left {
      font-family: 'Special Elite', 'Times New Roman', serif;
      font-size: 0.85rem;
      letter-spacing: 4px;
      color: #6a5a48;
    }

    .footer-note .right {
      font-family: '华文楷体', 'KaiTi', serif;
      font-size: 0.95rem;
      letter-spacing: 8px;
      border-left: 1px solid #b0987e;
      padding-left: 1.4rem;
      color: #8f7a66;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 640px) {
      .diary {
        padding: 1.8rem 1.2rem;
        border-radius: 8px 32px 8px 32px;
      }
      .title-section h1 {
        font-size: 2.6rem;
        letter-spacing: 8px;
      }
      .title-section .sub {
        font-size: 0.8rem;
        gap: 0.8rem;
      }
      .option-card {
        padding: 0.9rem 1.2rem;
        gap: 1.2rem;
        border-radius: 40px 10px 40px 10px;
      }
      .icon-box {
        width: 62px;
        height: 62px;
        font-size: 2rem;
      }
      .option-text .zh {
        font-size: 1.5rem;
        letter-spacing: 6px;
      }
      .option-text .en {
        font-size: 0.85rem;
        letter-spacing: 2px;
      }
      .options {
        gap: 1.6rem;
        margin: 2rem 0;
      }
      .footer-note {
        flex-direction: column;
        gap: 0.3rem;
        align-items: flex-start;
      }
    }

    /* 装饰：旧胶卷齿孔痕迹 (极淡) */
    .film-perf {
      position: absolute;
      bottom: 8%;
      right: 3%;
      width: 140px;
      height: 30px;
      background: repeating-linear-gradient(90deg, 
        transparent 0px, 
        transparent 8px, 
        rgba(80, 60, 40, 0.06) 8px, 
        rgba(80, 60, 40, 0.06) 10px);
      border-radius: 20px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.5;
      transform: rotate(-6deg);
    }

    /* 信纸折痕 */
    .letter-fold {
      position: absolute;
      top: 12%;
      left: 4%;
      width: 28%;
      height: 2px;
      background: rgba(120, 90, 70, 0.10);
      transform: rotate(-5deg);
      filter: blur(2px);
      pointer-events: none;
      z-index: 1;
    }

    /* 钢笔划痕 (装饰) */
    .pen-scratch {
      position: absolute;
      top: 45%;
      right: 6%;
      width: 15%;
      height: 1px;
      background: rgba(80, 60, 40, 0.05);
      transform: rotate(12deg);
      filter: blur(1px);
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="diary">
    <!-- 装饰层 -->
    <div class="film-perf"></div>
    <div class="letter-fold"></div>
    <div class="pen-scratch"></div>
    <div class="wear-mark"></div>

    <div class="content">
      <!-- 标题 -->
      <div class="title-section">
        <h1>放 映 厅</h1>
        <div class="sub">
          <span class="en">✦ projection hall ✦</span>
          <span class="zh">· 一九六〇 ·</span>
        </div>
      </div>

      <!-- 三个选项：信件 · 胶卷片 · 钢笔 (无emoji) -->
      <div class="options">
        <!-- 1. 信件 -->
        <a href="#" class="option-card" id="btn-letter" data-url="https://example.com/letter">
          <div class="icon-box">✉</div>
          <div class="option-text">
            <span class="zh">信 件</span>
            <span class="en">· letter ·</span>
          </div>
        </a>

        <!-- 2. 胶卷片 -->
        <a href="#" class="option-card" id="btn-film" data-url="https://example.com/film">
          <div class="icon-box">☯</div>
          <div class="option-text">
            <span class="zh">胶 卷 片</span>
            <span class="en">· film reel ·</span>
          </div>
        </a>

        <!-- 3. 钢笔 -->
        <a href="#" class="option-card" id="btn-pen" data-url="https://example.com/pen">
          <div class="icon-box">✎</div>
          <div class="option-text">
            <span class="zh">钢 笔</span>
            <span class="en">· fountain pen ·</span>
          </div>
        </a>
      </div>

      <!-- 页脚 -->
      <div class="footer-note">
        <span class="left">◈ 旧 日 残 页 ◈</span>
        <span class="right">☯ 映 像 拾 遗 ☯</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const letterBtn = document.getElementById('btn-letter');
      const filmBtn = document.getElementById('btn-film');
      const penBtn = document.getElementById('btn-pen');

      const urlMap = {
        letter: 'https://example.com/letter',
        film: 'https://example.com/film',
        pen: 'https://example.com/pen'
      };

      function handleNavigation(event, url) {
        event.preventDefault();
        if (url && url.startsWith('http')) {
          window.location.href = url;
        } else {
          alert(`[放映厅 · 六〇] 即将前往：${url || '未设定路径'}`);
        }
      }

      letterBtn.addEventListener('click', function(e) {
        const url = this.getAttribute('data-url') || urlMap.letter;
        handleNavigation(e, url);
      });

      filmBtn.addEventListener('click', function(e) {
        const url = this.getAttribute('data-url') || urlMap.film;
        handleNavigation(e, url);
      });

      penBtn.addEventListener('click', function(e) {
        const url = this.getAttribute('data-url') || urlMap.pen;
        handleNavigation(e, url);
      });

      console.log('📜 放映厅 · 六〇日记 跳转配置 (可修改 urlMap)');
      console.log('当前映射: ', urlMap);
      window.__diary = {
        urlMap: urlMap,
        updateUrl: function(key, newUrl) {
          if (urlMap.hasOwnProperty(key)) {
            urlMap[key] = newUrl;
            const btnMap = { letter: letterBtn, film: filmBtn, pen: penBtn };
            if (btnMap[key]) {
              btnMap[key].setAttribute('data-url', newUrl);
            }
            console.log(`✅ 已更新 ${key} 地址: ${newUrl}`);
          } else {
            console.warn('可用键: letter, film, pen');
          }
        }
      };
    })();
  </script>
</body>
</html>
