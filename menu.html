<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>放映厅 · 旧卷</title>
  <style>
    /* 全局重置 & 哥特暗黑做旧基底 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0c0806;  /* 极深底 */
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Times New Roman', 'Courier New', serif;
      padding: 1.5rem;
      position: relative;
    }

    /* 主卡片 — 枯树劈纹理 + 做旧黑底 */
    .projector-hall {
      max-width: 760px;
      width: 100%;
      background: #1a1410;  /* 深色底 */
      background-image: 
        /* 枯树劈裂纹理 (模仿干裂树皮) */
        repeating-linear-gradient(45deg, 
          rgba(60, 45, 35, 0.4) 0px, 
          rgba(60, 45, 35, 0.4) 1px, 
          rgba(80, 60, 45, 0.1) 1px, 
          rgba(80, 60, 45, 0.1) 3px,
          rgba(40, 30, 22, 0.3) 3px,
          rgba(40, 30, 22, 0.3) 4px),
        repeating-linear-gradient(135deg, 
          rgba(50, 35, 25, 0.3) 0px, 
          rgba(50, 35, 25, 0.3) 2px, 
          rgba(70, 50, 35, 0.1) 2px, 
          rgba(70, 50, 35, 0.1) 5px),
        /* 粗粝颗粒感 */
        radial-gradient(circle at 20% 30%, rgba(100, 75, 55, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(70, 50, 35, 0.2) 0%, transparent 50%),
        linear-gradient(180deg, #201a16 0%, #120e0b 100%);
      padding: 2.8rem 2.2rem;
      border-radius: 32px 8px 32px 8px;
      box-shadow: 
        0 24px 48px rgba(0, 0, 0, 0.9),
        inset 0 0 40px rgba(0, 0, 0, 0.7),
        0 0 0 1px #3d2e22,        /* 旧封边 */
        0 0 0 4px #1f1610,
        0 0 0 6px #2f211a;
      position: relative;
      transform: rotate(0.2deg);
      transition: all 0.2s;
      border: 1px solid #3a2c22;
    }

    /* 额外干裂纹理 — 模拟树皮剥离 */
    .projector-hall::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 32px 8px 32px 8px;
      background: 
        repeating-linear-gradient(65deg, 
          transparent 0px, 
          transparent 6px, 
          rgba(30, 20, 15, 0.2) 6px, 
          rgba(30, 20, 15, 0.2) 7px),
        repeating-linear-gradient(155deg, 
          transparent 0px, 
          transparent 10px, 
          rgba(20, 15, 10, 0.15) 10px, 
          rgba(20, 15, 10, 0.15) 11px);
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }

    /* 陈旧污渍 / 水渍 (更暗沉) */
    .projector-hall::after {
      content: '';
      position: absolute;
      top: 12%;
      left: 8%;
      width: 45%;
      height: 35%;
      background: radial-gradient(ellipse at 30% 50%, rgba(60, 45, 30, 0.25) 0%, transparent 70%);
      pointer-events: none;
      border-radius: 50%;
      filter: blur(10px);
      z-index: 1;
    }

    .stain-dark {
      position: absolute;
      bottom: 10%;
      right: 5%;
      width: 50%;
      height: 30%;
      background: radial-gradient(ellipse at 70% 60%, rgba(40, 30, 20, 0.3) 0%, transparent 70%);
      filter: blur(14px);
      pointer-events: none;
      z-index: 1;
    }

    /* 所有内容置于纹理之上 */
    .content {
      position: relative;
      z-index: 3;
    }

    /* 标题 — 放映厅 (中英混语) */
    .title-section {
      text-align: center;
      margin-bottom: 2.6rem;
      border-bottom: 1px solid #4d3a2c;
      padding-bottom: 1.2rem;
      position: relative;
    }

    .title-section h1 {
      font-family: 'Times New Roman', 'Georgia', '华文楷体', serif;
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: 10px;
      color: #e8ddd0;
      text-shadow: 
        0 0 8px rgba(200, 170, 140, 0.2),
        2px 2px 0 #0a0705,
        -1px -1px 0 #3d2e22;
      text-transform: uppercase;
      word-spacing: 12px;
      transform: scaleY(0.98);
      line-height: 1.2;
    }

    /* 英文哥特体副标 + 中文花体 */
    .title-section .sub {
      display: flex;
      justify-content: center;
      gap: 1.8rem;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 1.1rem;
      letter-spacing: 4px;
      color: #b8a48c;
      border-top: 1px solid #3d2e22;
      padding-top: 12px;
      opacity: 0.9;
      font-style: italic;
    }

    .title-section .sub .en {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 6px;
      font-size: 1.2rem;
      color: #cfbeaa;
      text-shadow: 0 0 6px rgba(180, 150, 120, 0.2);
      font-style: normal;
      /* 哥特感 */
      font-variant: small-caps;
    }

    .title-section .sub .zh {
      font-family: '华文楷体', 'KaiTi', 'Georgia', serif;
      letter-spacing: 8px;
      font-weight: 300;
      color: #cbb59e;
      font-size: 1.1rem;
      border-left: 1px solid #4d3a2c;
      padding-left: 1.2rem;
      font-style: italic;
      text-shadow: 0 0 4px rgba(160, 130, 100, 0.1);
    }

    /* 三枚按钮 — 哥特枯木感，白色字体 */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      margin: 2.8rem 0 1.2rem;
      position: relative;
      z-index: 3;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 1.3rem 1.8rem;
      background: #1f1712;
      background-image: 
        linear-gradient(145deg, #2a1f19 0%, #17110d 100%),
        repeating-linear-gradient(45deg, 
          rgba(80, 60, 45, 0.1) 0px, 
          rgba(80, 60, 45, 0.1) 1px, 
          rgba(50, 35, 25, 0.2) 1px, 
          rgba(50, 35, 25, 0.2) 3px);
      border: 1px solid #5a4536;
      border-radius: 40px 8px 40px 8px;
      box-shadow: 
        inset 0 -4px 0 #0a0705,
        inset 0 4px 12px rgba(0, 0, 0, 0.7),
        0 8px 16px rgba(0, 0, 0, 0.7),
        0 0 0 1px #3d2e22;
      color: #f2ede6;
      font-family: 'Times New Roman', 'Georgia', '华文楷体', serif;
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: 8px;
      text-transform: uppercase;
      text-shadow: 0 0 6px rgba(200, 180, 160, 0.1), 2px 2px 0 #0a0705;
      cursor: pointer;
      transition: all 0.15s ease;
      transform: rotate(-0.1deg);
      text-align: center;
      line-height: 1.3;
      word-break: keep-all;
      position: relative;
    }

    /* 做旧磨损线 */
    .btn::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 15px;
      width: 50px;
      height: 4px;
      background: rgba(180, 150, 120, 0.06);
      border-radius: 50%;
      filter: blur(4px);
      pointer-events: none;
    }

    .btn::after {
      content: '';
      position: absolute;
      bottom: 8px;
      right: 15px;
      width: 40px;
      height: 3px;
      background: rgba(120, 90, 70, 0.08);
      border-radius: 50%;
      filter: blur(3px);
      pointer-events: none;
    }

    /* 每个按钮细微色调差异 (仍然保持暗沉) */
    .btn:nth-child(1) {
      background: #241c16;
      background-image: linear-gradient(145deg, #2f241e, #19120e);
      border-color: #5a4536;
    }

    .btn:nth-child(2) {
      background: #221a14;
      background-image: linear-gradient(145deg, #2c201a, #17110d);
      border-color: #5f4a3a;
    }

    .btn:nth-child(3) {
      background: #201812;
      background-image: linear-gradient(145deg, #2a1e17, #150f0b);
      border-color: #554030;
    }

    /* 悬停：旧纸翻动 + 枯木微光 */
    .btn:hover {
      transform: scale(1.02) rotate(0.4deg);
      background-image: linear-gradient(145deg, #3a2c24, #1f1712);
      box-shadow: 
        inset 0 -4px 0 #0a0705,
        inset 0 4px 16px rgba(0, 0, 0, 0.8),
        0 12px 24px rgba(0, 0, 0, 0.8),
        0 0 0 1px #6a5342;
      border-color: #7a624e;
      color: #fcf6ed;
      letter-spacing: 10px;
      text-shadow: 0 0 12px rgba(200, 180, 160, 0.2), 2px 2px 0 #0a0705;
    }

    .btn:active {
      transform: scale(0.97) rotate(-0.2deg);
      box-shadow: 
        inset 0 2px 8px rgba(0, 0, 0, 0.6),
        0 4px 8px rgba(0, 0, 0, 0.5);
      transition: 0.03s;
    }

    /* 按钮内文字：中英混合 (在按钮内体现) */
    .btn .btn-en {
      font-family: 'Times New Roman', 'Georgia', serif;
      font-size: 1.1rem;
      letter-spacing: 4px;
      font-weight: 400;
      opacity: 0.7;
      display: block;
      margin-top: 2px;
      font-variant: small-caps;
      font-style: italic;
      color: #cbb59e;
    }

    .btn .btn-zh {
      font-family: '华文楷体', 'KaiTi', 'Georgia', serif;
      font-weight: 300;
      letter-spacing: 6px;
    }

    /* 页脚装饰 — 旧卷标记 */
    .footer-note {
      margin-top: 2.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #3d2e22;
      padding-top: 1.2rem;
      font-size: 0.8rem;
      color: #7a6856;
      letter-spacing: 2px;
      font-style: italic;
      opacity: 0.7;
      z-index: 3;
      position: relative;
    }

    .footer-note .left {
      font-family: 'Times New Roman', serif;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 4px;
      color: #8f7a66;
    }

    .footer-note .right {
      font-family: '华文楷体', 'KaiTi', serif;
      font-size: 0.9rem;
      letter-spacing: 6px;
      border-left: 1px solid #4d3a2c;
      padding-left: 1rem;
      color: #a48e7a;
    }

    /* 响应式 */
    @media (max-width: 480px) {
      .projector-hall {
        padding: 1.8rem 1.2rem;
        border-radius: 20px 4px 20px 4px;
      }
      .title-section h1 {
        font-size: 2.4rem;
        letter-spacing: 4px;
      }
      .title-section .sub {
        font-size: 0.9rem;
        gap: 0.8rem;
      }
      .btn {
        font-size: 1.4rem;
        padding: 1rem 0.8rem;
        letter-spacing: 4px;
        border-radius: 30px 6px 30px 6px;
      }
      .btn .btn-en {
        font-size: 0.9rem;
      }
      .button-group {
        gap: 1.2rem;
      }
      .footer-note {
        flex-direction: column;
        gap: 0.4rem;
        align-items: flex-start;
      }
    }

    /* 额外装饰 — 极淡的“树皮”斑点 */
    .bark-spec {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(70, 50, 35, 0.15) 0%, transparent 70%);
      width: 180px;
      height: 120px;
      top: 20%;
      right: 2%;
      filter: blur(20px);
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="projector-hall">
    <!-- 纹理层 -->
    <div class="bark-spec"></div>
    <div class="stain-dark"></div>

    <div class="content">
      <!-- 标题：放映厅 · 中英混语 -->
      <div class="title-section">
        <h1>放 映 厅</h1>
        <div class="sub">
          <span class="en">✦ projection hall ✦</span>
          <span class="zh">· 旧 光 影 ·</span>
        </div>
      </div>

      <!-- 三个按钮 — 无emoji，纯文字，中英混排 -->
      <div class="button-group">
        <!-- 还原记忆 -->
        <a href="#" class="btn" id="btn-memory" data-url="https://example.com/memory">
          <span class="btn-zh">还原记忆</span>
          <span class="btn-en">· memory recall ·</span>
        </a>
        <!-- 胶卷修复 -->
        <a href="#" class="btn" id="btn-film" data-url="https://example.com/film">
          <span class="btn-zh">胶卷修复</span>
          <span class="btn-en">· film restoration ·</span>
        </a>
        <!-- 演绎中心 -->
        <a href="#" class="btn" id="btn-stage" data-url="https://example.com/stage">
          <span class="btn-zh">演绎中心</span>
          <span class="btn-en">· performance hub ·</span>
        </a>
      </div>

      <!-- 页脚 -->
      <div class="footer-note">
        <span class="left">◈ 旧 卷 残 影 ◈</span>
        <span class="right">☯ 映 像 回 廊 ☯</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // 获取按钮
      const memoryBtn = document.getElementById('btn-memory');
      const filmBtn = document.getElementById('btn-film');
      const stageBtn = document.getElementById('btn-stage');

      // URL 映射 (sample，可随意替换)
      const urlMap = {
        memory: 'https://example.com/memory',
        film: 'https://example.com/film',
        stage: 'https://example.com/stage'
      };

      // 统一跳转处理
      function handleNavigation(event, url) {
        event.preventDefault();
        if (url && url.startsWith('http')) {
          window.location.href = url;
        } else {
          alert(`[放映厅] 即将前往：${url || '未设定路径'}`);
        }
      }

      // 绑定事件 (优先读取 data-url，其次 urlMap)
      memoryBtn.addEventListener('click', function(e) {
        const url = this.getAttribute('data-url') || urlMap.memory;
        handleNavigation(e, url);
      });

      filmBtn.addEventListener('click', function(e) {
        const url = this.getAttribute('data-url') || urlMap.film;
        handleNavigation(e, url);
      });

      stageBtn.addEventListener('click', function(e) {
        const url = this.getAttribute('data-url') || urlMap.stage;
        handleNavigation(e, url);
      });

      // 控制台辅助修改
      console.log('📽️ 放映厅 · 跳转配置 (可修改 urlMap)');
      console.log('当前映射: ', urlMap);
      window.__hall = {
        urlMap: urlMap,
        updateUrl: function(key, newUrl) {
          if (urlMap.hasOwnProperty(key)) {
            urlMap[key] = newUrl;
            const btnMap = { memory: memoryBtn, film: filmBtn, stage: stageBtn };
            if (btnMap[key]) {
              btnMap[key].setAttribute('data-url', newUrl);
            }
            console.log(`✅ 已更新 ${key} 地址: ${newUrl}`);
          } else {
            console.warn('可用键: memory, film, stage');
          }
        }
      };
    })();
  </script>
</body>
</html>
