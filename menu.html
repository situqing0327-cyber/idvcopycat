<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>放映厅 · 六〇哥特日记</title>
  <!-- 夸张哥特字体 + 手写花体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* 全局重置 — 暗黑哥特基底 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #1a1410;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.2rem;
      font-family: 'Times New Roman', 'Georgia', serif;
      position: relative;
    }

    /* ===== 日记本 — 极度做旧，夸张纹理 ===== */
    .diary {
      max-width: 920px;
      width: 100%;
      background: #d6c9b8;
      background-image: 
        /* 密集纤维 + 粗粝纸浆 */
        repeating-linear-gradient(0deg, 
          rgba(160, 140, 120, 0.15) 0px, 
          rgba(160, 140, 120, 0.15) 1px, 
          transparent 1px, 
          transparent 3px),
        repeating-linear-gradient(90deg, 
          rgba(140, 120, 100, 0.1) 0px, 
          rgba(140, 120, 100, 0.1) 2px, 
          transparent 2px, 
          transparent 5px),
        repeating-linear-gradient(45deg, 
          rgba(120, 100, 80, 0.08) 0px, 
          rgba(120, 100, 80, 0.08) 2px, 
          transparent 2px, 
          transparent 6px),
        /* 大块污渍 / 水渍 */
        radial-gradient(ellipse at 15% 25%, rgba(100, 75, 55, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 75%, rgba(80, 60, 40, 0.2) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 50%, rgba(120, 95, 70, 0.1) 0%, transparent 60%),
        /* 底纸色 */
        linear-gradient(180deg, #dacfc0 0%, #cdbfae 100%);
      padding: 3rem 2.5rem 2.5rem;
      border-radius: 12px 56px 12px 56px;
      box-shadow: 
        0 40px 80px rgba(0, 0, 0, 0.9),
        inset 0 0 80px rgba(0, 0, 0, 0.3),
        inset 0 0 40px rgba(90, 70, 50, 0.2),
        0 0 0 2px #8a7a66,
        0 0 0 6px #3d2e22,
        0 0 0 10px #6a5a48;
      position: relative;
      transform: rotate(-0.6deg);
      border: 1px solid #b0987e;
    }

    /* 书页中线 — 更明显 */
    .diary::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(100, 80, 60, 0.25) 15%, 
        rgba(100, 80, 60, 0.4) 50%, 
        rgba(100, 80, 60, 0.25) 85%, 
        transparent 100%);
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 2;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    /* 极度做旧：撕裂、霉斑、磨损 */
    .diary::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px 56px 12px 56px;
      background: 
        /* 霉斑 */
        radial-gradient(circle at 8% 12%, rgba(80, 60, 40, 0.2) 0%, transparent 30%),
        radial-gradient(circle at 92% 85%, rgba(60, 45, 30, 0.25) 0%, transparent 35%),
        radial-gradient(circle at 45% 70%, rgba(120, 90, 70, 0.15) 0%, transparent 25%),
        radial-gradient(circle at 70% 20%, rgba(100, 75, 55, 0.2) 0%, transparent 30%),
        /* 撕裂感 */
        repeating-linear-gradient(75deg, 
          transparent 0px, 
          transparent 20px, 
          rgba(80, 60, 40, 0.04) 20px, 
          rgba(80, 60, 40, 0.04) 21px),
        repeating-linear-gradient(-65deg, 
          transparent 0px, 
          transparent 30px, 
          rgba(60, 45, 30, 0.03) 30px, 
          rgba(60, 45, 30, 0.03) 31px);
      pointer-events: none;
      z-index: 1;
    }

    /* 额外夸张污渍 */
    .stain-heavy {
      position: absolute;
      bottom: 8%;
      right: 3%;
      width: 40%;
      height: 25%;
      background: radial-gradient(ellipse at 60% 50%, rgba(70, 50, 35, 0.2) 0%, transparent 60%);
      filter: blur(12px);
      pointer-events: none;
      z-index: 1;
      border-radius: 50%;
    }
    .stain-heavy2 {
      position: absolute;
      top: 12%;
      left: 2%;
      width: 30%;
      height: 20%;
      background: radial-gradient(ellipse at 40% 50%, rgba(100, 75, 55, 0.15) 0%, transparent 50%);
      filter: blur(15px);
      pointer-events: none;
      z-index: 1;
      border-radius: 50%;
    }

    .content {
      position: relative;
      z-index: 3;
    }

    /* ===== 标题：放映厅 — 夸张哥特 ===== */
    .title-section {
      text-align: center;
      margin-bottom: 2.8rem;
      padding-bottom: 1.4rem;
      border-bottom: 3px double #8a7a66;
      position: relative;
    }

    .title-section h1 {
      font-family: 'UnifrakturMaguntia', 'MedievalSharp', 'Times New Roman', cursive;
      font-size: 4.2rem;
      font-weight: 700;
      letter-spacing: 18px;
      color: #1f1610;
      text-shadow: 
        0 0 20px rgba(160, 130, 100, 0.15),
        4px 4px 0 rgba(100, 80, 60, 0.2),
        -2px -2px 0 rgba(230, 210, 190, 0.2);
      text-transform: uppercase;
      word-spacing: 12px;
      transform: scaleY(0.95) rotate(-0.5deg);
      line-height: 1.1;
    }

    .title-section .sub {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-top: 10px;
      font-size: 1.1rem;
      color: #4d3a2c;
      border-top: 2px dotted #b0987e;
      padding-top: 12px;
      letter-spacing: 4px;
    }

    .title-section .sub .en {
      font-family: 'Cinzel', 'Times New Roman', serif;
      font-size: 1.4rem;
      letter-spacing: 8px;
      color: #3d2e22;
      opacity: 0.85;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(100, 80, 60, 0.1);
    }

    .title-section .sub .zh {
      font-family: '华文楷体', 'KaiTi', 'Georgia', serif;
      font-size: 1.1rem;
      letter-spacing: 10px;
      color: #5f4c3a;
      border-left: 2px solid #b0987e;
      padding-left: 1.6rem;
      font-style: italic;
      font-weight: 300;
    }

    /* ===== 三个选项 — 无图标，纯夸张哥特文字 ===== */
    .options {
      display: flex;
      flex-direction: column;
      gap: 2.4rem;
      margin: 3.2rem 0 2rem;
      position: relative;
      z-index: 3;
    }

    .option-card {
      display: block;
      width: 100%;
      padding: 1.6rem 2.2rem;
      background: rgba(200, 180, 160, 0.2);
      background-image: 
        linear-gradient(145deg, rgba(210, 190, 170, 0.3) 0%, rgba(180, 160, 140, 0.15) 100%),
        repeating-linear-gradient(45deg, 
          transparent 0px, 
          transparent 6px, 
          rgba(140, 120, 100, 0.04) 6px, 
          rgba(140, 120, 100, 0.04) 7px);
      border: 2px solid #8a7a66;
      border-radius: 80px 12px 80px 12px;
      box-shadow: 
        inset 0 -4px 0 #5f4c3a,
        inset 0 6px 20px rgba(255, 235, 200, 0.1),
        0 8px 24px rgba(0, 0, 0, 0.3),
        0 0 0 2px #b8a084;
      transition: all 0.15s ease;
      cursor: pointer;
      text-decoration: none;
      color: #1f1610;
      transform: rotate(-0.2deg);
      position: relative;
      text-align: center;
    }

    /* 做旧磨损 */
    .option-card::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 25px;
      width: 60px;
      height: 4px;
      background: rgba(160, 130, 100, 0.08);
      border-radius: 50%;
      filter: blur(4px);
      pointer-events: none;
    }

    .option-card::after {
      content: '';
      position: absolute;
      bottom: 12px;
      right: 25px;
      width: 50px;
      height: 4px;
      background: rgba(120, 90, 70, 0.06);
      border-radius: 50%;
      filter: blur(4px);
      pointer-events: none;
    }

    /* 纯文字 — 夸张哥特 + 花体中英 */
    .option-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .option-text .zh {
      font-family: '华文楷体', 'KaiTi', 'Georgia', serif;
      font-size: 2.6rem;
      font-weight: 400;
      letter-spacing: 16px;
      color: #1a120e;
      text-shadow: 2px 2px 0 rgba(160, 130, 100, 0.15);
      line-height: 1.2;
    }

    .option-text .en {
      font-family: 'UnifrakturMaguntia', 'Cinzel', 'Times New Roman', serif;
      font-size: 1.5rem;
      letter-spacing: 6px;
      color: #3d2e22;
      opacity: 0.75;
      font-weight: 700;
      border-top: 2px dotted #b0987e;
      padding-top: 6px;
      display: inline-block;
      text-shadow: 0 0 12px rgba(100, 80, 60, 0.1);
      transform: scaleY(1.05);
    }

    /* 各卡片独特色调 (夸张) */
    .option-card:nth-child(1) {
      background: rgba(210, 190, 165, 0.25);
      border-color: #7a6a58;
    }
    .option-card:nth-child(1) .option-text .en {
      color: #4d3a2c;
    }

    .option-card:nth-child(2) {
      background: rgba(195, 175, 155, 0.25);
      border-color: #8a7a66;
    }
    .option-card:nth-child(2) .option-text .en {
      color: #3d3228;
    }

    .option-card:nth-child(3) {
      background: rgba(205, 185, 160, 0.25);
      border-color: #6a5a48;
    }
    .option-card:nth-child(3) .option-text .en {
      color: #2f241e;
    }

    /* 悬停 — 强烈哥特翻动感 */
    .option-card:hover {
      transform: scale(1.04) rotate(0.8deg);
      background: rgba(220, 200, 180, 0.4);
      box-shadow: 
        inset 0 -4px 0 #5f4c3a,
        inset 0 8px 30px rgba(255, 235, 200, 0.15),
        0 16px 40px rgba(0, 0, 0, 0.4),
        0 0 0 3px #b8a084;
      border-color: #5f4c3a;
    }

    .option-card:hover .option-text .zh {
      letter-spacing: 22px;
      color: #0f0a07;
      text-shadow: 4px 4px 0 rgba(160, 130, 100, 0.2);
    }

    .option-card:hover .option-text .en {
      letter-spacing: 10px;
      color: #1f1610;
      opacity: 1;
      text-shadow: 0 0 20px rgba(100, 80, 60, 0.2);
    }

    .option-card:active {
      transform: scale(0.96) rotate(-0.3deg);
      box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.3);
      transition: 0.03s;
    }

    /* ===== 页脚 — 哥特标记 ===== */
    .footer-note {
      margin-top: 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 3px double #8a7a66;
      padding-top: 1.2rem;
      font-size: 0.9rem;
      color: #5f4c3a;
      letter-spacing: 3px;
      font-style: italic;
      opacity: 0.8;
      position: relative;
      z-index: 3;
    }

    .footer-note .left {
      font-family: 'UnifrakturMaguntia', 'Cinzel', serif;
      font-size: 1.2rem;
      letter-spacing: 6px;
      color: #3d2e22;
      font-weight: 700;
    }

    .footer-note .right {
      font-family: '华文楷体', 'KaiTi', serif;
      font-size: 1rem;
      letter-spacing: 8px;
      border-left: 2px solid #b0987e;
      padding-left: 1.4rem;
      color: #6a5a48;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 640px) {
      .diary {
        padding: 1.8rem 1.2rem;
        border-radius: 8px 32px 8px 32px;
      }
      .title-section h1 {
        font-size: 2.8rem;
        letter-spacing: 10px;
      }
      .title-section .sub {
        font-size: 0.9rem;
        gap: 0.8rem;
      }
      .title-section .sub .en {
        font-size: 1rem;
        letter-spacing: 4px;
      }
      .option-card {
        padding: 1.2rem 1rem;
        border-radius: 50px 8px 50px 8px;
      }
      .option-text .zh {
        font-size: 1.8rem;
        letter-spacing: 10px;
      }
      .option-text .en {
        font-size: 1.1rem;
        letter-spacing: 4px;
      }
      .options {
        gap: 1.6rem;
        margin: 2.2rem 0;
      }
      .footer-note {
        flex-direction: column;
        gap: 0.4rem;
        align-items: flex-start;
      }
      .footer-note .left {
        font-size: 1rem;
      }
    }

    /* 额外夸张哥特装饰 — 暗色花纹 */
    .gothic-ornament {
      position: absolute;
      top: 5%;
      right: 3%;
      font-family: 'UnifrakturMaguntia', serif;
      font-size: 5rem;
      color: rgba(80, 60, 40, 0.05);
      pointer-events: none;
      z-index: 0;
      transform: rotate(12deg);
      letter-spacing: 20px;
      user-select: none;
    }
    .gothic-ornament2 {
      position: absolute;
      bottom: 5%;
      left: 2%;
      font-family: 'Cinzel', serif;
      font-size: 4rem;
      color: rgba(60, 45, 30, 0.04);
      pointer-events: none;
      z-index: 0;
      transform: rotate(-8deg);
      letter-spacing: 15px;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="diary">
    <!-- 夸张装饰纹理 -->
    <div class="stain-heavy"></div>
    <div class="stain-heavy2"></div>
    <div class="gothic-ornament">𝕲𝖔𝖙𝖍𝖎𝖈</div>
    <div class="gothic-ornament2">𝖁𝖎𝖓𝖙𝖆𝖌𝖊</div>

    <div class="content">
      <!-- 标题：放映厅 · 夸张哥特 -->
      <div class="title-section">
        <h1>放 映 厅</h1>
        <div class="sub">
          <span class="en">✦ PROJECTION HALL ✦</span>
          <span class="zh">· 一九六〇 ·</span>
        </div>
      </div>

      <!-- 三个选项：纯文字，无图标，夸张哥特 -->
      <div class="options">
        <a href="#" class="option-card" id="btn-letter" data-url="https://example.com/letter">
          <div class="option-text">
            <span class="zh">信 件</span>
            <span class="en">✧ L E T T E R ✧</span>
          </div>
        </a>

        <a href="#" class="option-card" id="btn-film" data-url="https://example.com/film">
          <div class="option-text">
            <span class="zh">胶 卷 片</span>
            <span class="en">✧ F I L M   R E E L ✧</span>
          </div>
        </a>

        <a href="#" class="option-card" id="btn-pen" data-url="https://example.com/pen">
          <div class="option-text">
            <span class="zh">钢 笔</span>
            <span class="en">✧ F O U N T A I N   P E N ✧</span>
          </div>
        </a>
      </div>

      <!-- 页脚 -->
      <div class="footer-note">
        <span class="left">◈ 旧 日 残 影 ◈</span>
        <span class="right">☯ 映 像 拾 遗 ☯</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const letterBtn = document.getElementById('btn-letter');
      const filmBtn = document.getElementById('btn-film');
      const penBtn = document.getElementById('btn-pen');

      const urlMap = {
        letter: 'https://example.com/letter',
        film: 'https://example.com/film',
        pen: 'https://example.com/pen'
      };

      function handleNavigation(event, url) {
        event.preventDefault();
        if (url && url.startsWith('http')) {
          window.location.href = url;
        } else {
          alert(`[放映厅 · 六〇] 即将前往：${url || '未设定路径'}`);
        }
      }

      letterBtn.addEventListener('click', function(e) {
        const url = this.getAttribute('data-url') || urlMap.letter;
        handleNavigation(e, url);
      });

      filmBtn.addEventListener('click', function(e) {
        const url = this.getAttribute('data-url') || urlMap.film;
        handleNavigation(e, url);
      });

      penBtn.addEventListener('click', function(e) {
        const url = this.getAttribute('data-url') || urlMap.pen;
        handleNavigation(e, url);
      });

      console.log('📜 放映厅 · 哥特日记 (夸张风格)');
      console.log('跳转映射: ', urlMap);
      window.__diary = {
        urlMap: urlMap,
        updateUrl: function(key, newUrl) {
          if (urlMap.hasOwnProperty(key)) {
            urlMap[key] = newUrl;
            const btnMap = { letter: letterBtn, film: filmBtn, pen: penBtn };
            if (btnMap[key]) {
              btnMap[key].setAttribute('data-url', newUrl);
            }
            console.log(`✅ 已更新 ${key} 地址: ${newUrl}`);
          } else {
            console.warn('可用键: letter, film, pen');
          }
        }
      };
    })();
  </script>
</body>
</html>
